name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh data"]   # rebuild after a data refresh
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Ensure data
        run: test -f data/processed/compensation_all_years.csv || python src/etl.py

      - name: Build plots and infographics
        run: |
          python src/plots.py
          python src/infographics.py

      - name: Render the reports
        run: |
          quarto render reports/brief.qmd
          quarto render reports/detailed.qmd
          mkdir -p site/reports
          cp reports/brief.html reports/brief.pdf reports/detailed.html site/reports/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
